# M6 observability + M7 alerting: scrape every /metrics, evaluate rules,
# route firing alerts to Alertmanager. All targets are internal DNS names;
# Prometheus attaches to `internal` via compose.monitoring.yaml.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  - job_name: "ai"
    static_configs:
      - targets: ["ai:8001"]
    metrics_path: /metrics

  - job_name: "ehr"
    static_configs:
      - targets: ["ehr:8002"]
    metrics_path: /metrics

  - job_name: "worker"
    static_configs:
      - targets: ["worker:8003"]
    metrics_path: /metrics

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
    metrics_path: /metrics

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
    metrics_path: /metrics

  - job_name: "alert-api"
    static_configs:
      - targets: ["alert-api:8080"]
    metrics_path: /metrics

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
