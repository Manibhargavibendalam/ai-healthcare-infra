# M5 controlled ingress: dynamic upstream via the compose embedded DNS
# (127.0.0.11) so `docker compose up -d --scale api=N` ACTUALLY balances:
# a static `upstream { server api:8000; }` resolves ONCE at nginx start and
# pins to one replica. With a variable, nginx re-resolves per TTL and
# round-robins across all healthy replica IPs. (M-deploy blue/green reuses
# this: flip $backend between versioned upstreams after /ready passes.)
server_tokens off;

server {
  listen 8080;
  resolver 127.0.0.11 valid=5s ipv6=off;

  # Ingress self-check (load-balancer style health probe).
  location = /healthz {
    access_log off;
    return 200 'ok';
  }

  location / {
    set $backend api;
    proxy_pass http://$backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Preserve end-to-end correlation: client-supplied id flows to the API.
    proxy_set_header X-Request-ID $http_x_request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }
}
